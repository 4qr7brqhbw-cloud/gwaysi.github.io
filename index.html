<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Scanner</title>
    <link rel="icon" type="image/png" href="kbz-sm.png">
    <link href="bootstrap.min.css" rel="stylesheet">
    <script src="https://unpkg.com/html5-qrcode/minified/html5-qrcode.min.js"></script>
    <style>
        body {
            padding: 20px;
            background-color: #f8f9fa;
        }
        .scanner-container {
            max-width: 500px;
            margin: 0 auto;
            text-align: center;
        }
        #reader {
            width: 100%;
            margin: 20px 0;
        }
        #result {
            margin: 20px 0;
            padding: 15px;
            background: white;
            border-radius: 5px;
        }
        .advice-section {
            margin-top: 30px;
            padding: 20px;
            background: white;
            border-radius: 5px;
            cursor: pointer;
        }
        .advice-section:hover {
            background: #e9ecef;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="scanner-container">
            <h1>QR Code Scanner</h1>
            <div id="reader"></div>
            <div id="result">Scan result will appear here</div>
            
            <div class="advice-section" onclick="window.location.href='advice/'">
                <h3>Click for Advice & Tips →</h3>
                <p class="text-muted">Get helpful scanning tips and information</p>
            </div>
        </div>
    </div>

    <script>
        function onScanSuccess(decodedText, decodedResult) {
            document.getElementById('result').innerHTML = 
                `<div class="alert alert-success">
                    <strong>Scanned:</strong> ${decodedText}
                </div>`;
        }

        function onScanFailure(error) {
            // Scan failure handling
        }

        let html5QrcodeScanner = new Html5QrcodeScanner(
            "reader",
            { fps: 10, qrbox: 250 },
            false
        );
        html5QrcodeScanner.render(onScanSuccess, onScanFailure);
    </script>
</body>
</html>
