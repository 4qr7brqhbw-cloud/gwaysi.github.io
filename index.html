<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device=device-width, initial-scale=1.0">
    <title>QR Scanner</title>
    <link rel="icon" type="image/png" href="kbz-sm.png">
    <link href="bootstrap.min.css" rel="stylesheet">
    <script src="https://unpkg.com/html5-qrcode/minified/html5-qrcode.min.js"></script>
</head>
<body>
    <div class="container mt-4">
        <div class="text-center">
            <h1>QR Code Scanner</h1>
            <div id="reader" class="my-4"></div>
            <div id="result" class="alert alert-info">Scan result will appear here</div>
            
            <div class="card mt-4" onclick="window.location.href='advice/'" style="cursor: pointer;">
                <div class="card-body">
                    <h5 class="card-title">Click for Advice →</h5>
                    <p class="card-text">Get scanning tips and information</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        function onScanSuccess(decodedText, decodedResult) {
            document.getElementById('result').innerHTML = 
                `<div class="alert alert-success">
                    <strong>Scanned:</strong> ${decodedText}
                </div>`;
        }

        function onScanFailure(error) {
            // Handle scan failure
        }

        let html5QrcodeScanner = new Html5QrcodeScanner(
            "reader",
            { fps: 10, qrbox: 250 },
            false
        );
        html5QrcodeScanner.render(onScanSuccess, onScanFailure);
    </script>
</body>
</html>
