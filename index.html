<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Scanner</title>
    <!-- FAVICON IS HERE -->
    <link rel="icon" type="image/png" href="kbz-sm.png">
    <link rel="shortcut icon" href="kbz-sm.png">
    <script src="https://unpkg.com/html5-qrcode/minified/html5-qrcode.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 500px;
            margin: 50px auto;
            padding: 20px;
            text-align: center;
        }
        #reader {
            width: 100%;
            margin: 20px 0;
        }
        #result {
            margin: 20px 0;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        .advice-section {
            margin-top: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 5px;
            cursor: pointer;
        }
        .advice-section:hover {
            background: #e9ecef;
        }
    </style>
</head>
<body>
    <h1>QR Code Scanner</h1>
    <div id="reader"></div>
    <div id="result">Scan result will appear here</div>
    
    <div class="advice-section" onclick="window.location.href='advice'">
        <h3>Click for Advice & Tips →</h3>
        <p>Get helpful scanning tips and information</p>
    </div>

    <script>
        function onScanSuccess(decodedText, decodedResult) {
            document.getElementById('result').innerHTML = 
                `<strong>Scanned:</strong> ${decodedText}`;
        }

        function onScanFailure(error) {
            // Handle scan failure
        }

        let html5QrcodeScanner = new Html5QrcodeScanner(
            "reader",
            { fps: 10, qrbox: 250 },
            false
        );
        html5QrcodeScanner.render(onScanSuccess, onScanFailure);
    </script>
</body>
</html>
