<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Scanner</title>
    <link rel="icon" type="image/png" href="kbz-sm.png">
    <script src="https://unpkg.com/html5-qrcode/minified/html5-qrcode.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            text-align: center;
        }
        #reader {
            width: 100%;
            margin: 20px auto;
        }
        #result {
            margin: 20px 0;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        .advice-section {
            background-color: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <document>
        <h1>QR Code Scanner</h1>
        
        <section class="advice-section">
            <h2>Scan QR Code</h2>
            <div id="reader"></div>
            <div id="result">Scan result will appear here</div>
        </section>

        <section class="advice-section">
            <h3>Tips for Scanning</h3>
            <p>• Ensure good lighting</p>
            <p>• Hold steady about 6-12 inches from the code</p>
            <p>• Keep the QR code within the scanner frame</p>
        </section>
    </document>

    <script>
        function onScanSuccess(decodedText, decodedResult) {
            document.getElementById('result').innerHTML = `
                <strong>Scanned Result:</strong><br>
                ${decodedText}
            `;
        }

        function onScanFailure(error) {
            // Handle scan failure
        }

        let html5QrcodeScanner = new Html5QrcodeScanner(
            "reader",
            { fps: 10, qrbox: { width: 250, height: 250 } },
            false
        );
        html5QrcodeScanner.render(onScanSuccess, onScanFailure);
    </script>
</body>
</html>
